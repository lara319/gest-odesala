<style>

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fb;
  color: #1f2937;
  min-height: 100vh;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

a {
  text-decoration: none;
  color: inherit;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #eff6ff;

  --secondary: #64748b;

  --success: #16a34a;
  --success-light: #dcfce7;

  --warning: #d97706;
  --warning-light: #fef3c7;

  --danger: #dc2626;
  --danger-light: #fee2e2;

  --info: #0891b2;
  --info-light: #cffafe;

  --dark: #111827;
  --dark-2: #1f2937;

  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;

  --white: #ffffff;

  --border: #e5e7eb;

  --sidebar-width: 260px;

  --radius: 12px;

  --shadow:
    0 4px 15px rgba(15, 23, 42, 0.06);

  --shadow-lg:
    0 15px 40px rgba(15, 23, 42, 0.12);

}


/* =========================================================
   LOADING
========================================================= */

.loading-overlay {

  position: fixed;

  inset: 0;

  background: rgba(255, 255, 255, 0.95);

  display: flex;

  align-items: center;

  justify-content: center;

  z-index: 9999;

}

.loading-box {

  text-align: center;

}

.loading-box p {

  margin-top: 15px;

  color: var(--gray-600);

  font-size: 14px;

}

.spinner {

  width: 42px;

  height: 42px;

  border: 4px solid var(--gray-200);

  border-top-color: var(--primary);

  border-radius: 50%;

  animation: spin 0.8s linear infinite;

}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================================
   LOGIN
========================================================= */

.login-page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px;

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );

}

.login-container {

  width: 100%;

  max-width: 420px;

  background: var(--white);

  padding: 40px;

  border-radius: 18px;

  box-shadow: var(--shadow-lg);

}

.login-header {

  text-align: center;

  margin-bottom: 30px;

}

.login-icon {

  width: 70px;

  height: 70px;

  margin: 0 auto 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 18px;

  background: var(--primary-light);

  font-size: 34px;

}

.login-header h1 {

  color: var(--dark);

  margin-bottom: 7px;

}

.login-header p {

  color: var(--gray-500);

  font-size: 14px;

}

.login-form {

  display: flex;

  flex-direction: column;

  gap: 18px;

}


/* =========================================================
   FORMULÁRIOS
========================================================= */

.form-group {

  display: flex;

  flex-direction: column;

  gap: 7px;

}

.form-group label {

  font-size: 13px;

  font-weight: 600;

  color: var(--gray-700);

}

.form-group input,
.form-group select,
.form-group textarea {

  width: 100%;

  border: 1px solid var(--gray-300);

  background: var(--white);

  border-radius: 8px;

  padding: 11px 13px;

  outline: none;

  transition: 0.2s;

  color: var(--dark);

}

.form-group textarea {

  min-height: 100px;

  resize: vertical;

}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

  border-color: var(--primary);

  box-shadow:
    0 0 0 3px rgba(37, 99, 235, 0.10);

}

.form-message {

  text-align: center;

  font-size: 13px;

  color: var(--danger);

  min-height: 18px;

}


/* =========================================================
   APP
========================================================= */

.app-container {

  min-height: 100vh;

  display: flex;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

  position: fixed;

  left: 0;

  top: 0;

  bottom: 0;

  width: var(--sidebar-width);

  background: var(--white);

  border-right: 1px solid var(--border);

  display: flex;

  flex-direction: column;

  z-index: 1000;

  transition: 0.3s;

}

.sidebar-header {

  height: 75px;

  padding: 0 20px;

  display: flex;

  align-items: center;

  gap: 12px;

  border-bottom: 1px solid var(--border);

}

.logo-icon {

  width: 40px;

  height: 40px;

  border-radius: 10px;

  background: var(--primary-light);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 21px;

}

.sidebar-header h2 {

  font-size: 16px;

  color: var(--dark);

}

.sidebar-header span {

  display: block;

  font-size: 11px;

  color: var(--gray-500);

  margin-top: 2px;

}


/* =========================================================
   USUÁRIO SIDEBAR
========================================================= */

.sidebar-user {

  margin: 15px;

  padding: 12px;

  background: var(--gray-50);

  border-radius: 10px;

  display: flex;

  align-items: center;

  gap: 10px;

}

.user-avatar {

  width: 38px;

  height: 38px;

  border-radius: 50%;

  background: var(--primary-light);

  display: flex;

  align-items: center;

  justify-content: center;

}

.user-info {

  display: flex;

  flex-direction: column;

  min-width: 0;

}

.user-info strong {

  font-size: 13px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

.user-info span {

  font-size: 11px;

  color: var(--gray-500);

  margin-top: 3px;

}


/* =========================================================
   MENU
========================================================= */

.menu {

  padding: 5px 12px;

  overflow-y: auto;

  flex: 1;

}

.menu-title {

  font-size: 10px;

  font-weight: 700;

  color: var(--gray-400);

  padding: 15px 10px 7px;

  letter-spacing: 0.7px;

}

.menu-item {

  width: 100%;

  border: 0;

  background: transparent;

  display: flex;

  align-items: center;

  gap: 11px;

  padding: 10px 12px;

  border-radius: 8px;

  color: var(--gray-600);

  font-size: 13px;

  text-align: left;

  margin-bottom: 3px;

  transition: 0.2s;

}

.menu-item:hover {

  background: var(--gray-100);

  color: var(--primary);

}

.menu-item.active {

  background: var(--primary-light);

  color: var(--primary);

  font-weight: 600;

}

.menu-icon {

  width: 20px;

  text-align: center;

  font-size: 16px;

}


/* =========================================================
   SIDEBAR FOOTER
========================================================= */

.sidebar-footer {

  padding: 15px;

  border-top: 1px solid var(--border);

}

.logout-button {

  width: 100%;

  border: 0;

  background: transparent;

  color: var(--danger);

  padding: 10px 12px;

  border-radius: 8px;

  display: flex;

  gap: 10px;

  align-items: center;

  font-size: 13px;

}

.logout-button:hover {

  background: var(--danger-light);

}


/* =========================================================
   CONTEÚDO
========================================================= */

.main-content {

  margin-left: var(--sidebar-width);

  width: calc(100% - var(--sidebar-width));

  min-height: 100vh;

}


/* =========================================================
   TOPBAR
========================================================= */

.topbar {

  height: 75px;

  background: var(--white);

  border-bottom: 1px solid var(--border);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 30px;

  position: sticky;

  top: 0;

  z-index: 100;

}

.topbar-left {

  display: flex;

  align-items: center;

  gap: 15px;

}

.topbar-left h1 {

  font-size: 18px;

  color: var(--dark);

}

.topbar-left p {

  color: var(--gray-500);

  font-size: 12px;

  margin-top: 3px;

}

.topbar-right {

  color: var(--gray-500);

  font-size: 12px;

}

.menu-toggle {

  display: none;

  border: 0;

  background: var(--gray-100);

  width: 38px;

  height: 38px;

  border-radius: 8px;

  font-size: 19px;

}


/* =========================================================
   PÁGINAS
========================================================= */

.page {

  display: none;

  padding: 30px;

  animation: pageIn 0.2s ease;

}

.page.active-page {

  display: block;

}

@keyframes pageIn {

  from {

    opacity: 0;

    transform: translateY(5px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

.page-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  margin-bottom: 25px;

}

.page-header h2 {

  font-size: 23px;

  color: var(--dark);

}

.page-header p {

  font-size: 13px;

  color: var(--gray-500);

  margin-top: 5px;

}


/* =========================================================
   BOTÕES
========================================================= */

.btn {

  border: 0;

  border-radius: 8px;

  padding: 10px 15px;

  font-size: 13px;

  font-weight: 600;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  transition: 0.2s;

}

.btn-primary {

  background: var(--primary);

  color: var(--white);

}

.btn-primary:hover {

  background: var(--primary-dark);

  transform: translateY(-1px);

}

.btn-secondary {

  background: var(--gray-100);

  color: var(--gray-700);

}

.btn-secondary:hover {

  background: var(--gray-200);

}

.btn-success {

  background: var(--success);

  color: var(--white);

}

.btn-danger {

  background: var(--danger);

  color: var(--white);

}

.btn-warning {

  background: var(--warning);

  color: var(--white);

}

.btn-login {

  width: 100%;

  padding: 12px;

  margin-top: 5px;

}


/* =========================================================
   CARDS
========================================================= */

.dashboard-cards {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 15px;

  margin-bottom: 20px;

}

.stat-card {

  background: var(--white);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  padding: 18px;

  display: flex;

  align-items: center;

  gap: 13px;

  box-shadow: var(--shadow);

}

.stat-icon {

  width: 45px;

  height: 45px;

  border-radius: 10px;

  background: var(--primary-light);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 21px;

  flex-shrink: 0;

}

.stat-card span {

  display: block;

  font-size: 12px;

  color: var(--gray-500);

  margin-bottom: 5px;

}

.stat-card strong {

  font-size: 23px;

  color: var(--dark);

}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard-grid {

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 18px;

}

.dashboard-panel {

  background: var(--white);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  box-shadow: var(--shadow);

  min-height: 260px;

}

.panel-header {

  padding: 17px 20px;

  border-bottom: 1px solid var(--border);

}

.panel-header h3 {

  font-size: 14px;

  color: var(--dark);

}

.chart-container {

  padding: 20px;

  min-height: 200px;

}

.empty-chart {

  height: 170px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: var(--gray-400);

  font-size: 13px;

}


/* =========================================================
   CONTENT CARD
========================================================= */

.content-card {

  background: var(--white);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  box-shadow: var(--shadow);

  overflow: hidden;

}

.table-toolbar {

  padding: 15px;

  border-bottom: 1px solid var(--border);

}

.search-input {

  width: 100%;

  max-width: 350px;

  padding: 10px 13px;

  border: 1px solid var(--gray-300);

  border-radius: 8px;

  outline: none;

}

.search-input:focus {

  border-color: var(--primary);

}


/* =========================================================
   FILTROS
========================================================= */

.filters {

  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  padding: 15px;

  border-bottom: 1px solid var(--border);

}

.filters input,
.filters select {

  padding: 10px 12px;

  border: 1px solid var(--gray-300);

  border-radius: 8px;

  outline: none;

  background: var(--white);

}

.filters input:focus,
.filters select:focus {

  border-color: var(--primary);

}


/* =========================================================
   TABELAS
========================================================= */

.table-responsive {

  width: 100%;

  overflow-x: auto;

}

table {

  width: 100%;

  border-collapse: collapse;

  min-width: 750px;

}

thead {

  background: var(--gray-50);

}

th {

  padding: 13px 15px;

  text-align: left;

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: 0.4px;

  color: var(--gray-500);

  white-space: nowrap;

  border-bottom: 1px solid var(--border);

}

td {

  padding: 13px 15px;

  font-size: 12px;

  color: var(--gray-700);

  border-bottom: 1px solid var(--gray-100);

  vertical-align: middle;

}

tbody tr:hover {

  background: var(--gray-50);

}

tbody tr:last-child td {

  border-bottom: 0;

}


/* =========================================================
   BADGES
========================================================= */

.badge {

  display: inline-flex;

  align-items: center;

  padding: 4px 8px;

  border-radius: 20px;

  font-size: 10px;

  font-weight: 700;

}

.badge-success {

  background: var(--success-light);

  color: var(--success);

}

.badge-warning {

  background: var(--warning-light);

  color: var(--warning);

}

.badge-danger {

  background: var(--danger-light);

  color: var(--danger);

}

.badge-info {

  background: var(--info-light);

  color: var(--info);

}


/* =========================================================
   AÇÕES DA TABELA
========================================================= */

.table-actions {

  display: flex;

  gap: 5px;

}

.action-button {

  width: 30px;

  height: 30px;

  border: 0;

  border-radius: 6px;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  background: var(--gray-100);

}

.action-button:hover {

  background: var(--gray-200);

}

.action-edit {

  color: var(--primary);

}

.action-delete {

  color: var(--danger);

}


/* =========================================================
   RELATÓRIOS
========================================================= */

.report-grid {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 18px;

}

.report-card {

  background: var(--white);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  padding: 22px;

  box-shadow: var(--shadow);

}

.report-icon {

  width: 45px;

  height: 45px;

  border-radius: 10px;

  background: var(--primary-light);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 21px;

  margin-bottom: 15px;

}

.report-card h3 {

  font-size: 15px;

  margin-bottom: 8px;

}

.report-card p {

  font-size: 12px;

  color: var(--gray-500);

  line-height: 1.5;

  min-height: 40px;

  margin-bottom: 17px;

}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay {

  position: fixed;

  inset: 0;

  background: rgba(15, 23, 42, 0.55);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 5000;

}

.modal {

  width: 100%;

  max-width: 650px;

  max-height: 90vh;

  background: var(--white);

  border-radius: 14px;

  box-shadow: var(--shadow-lg);

  display: flex;

  flex-direction: column;

  overflow: hidden;

}

.modal-header {

  padding: 18px 22px;

  border-bottom: 1px solid var(--border);

  display: flex;

  align-items: center;

  justify-content: space-between;

}

.modal-header h2 {

  font-size: 17px;

}

.modal-close {

  width: 32px;

  height: 32px;

  border: 0;

  background: var(--gray-100);

  border-radius: 7px;

  font-size: 22px;

  color: var(--gray-600);

}

.modal-close:hover {

  background: var(--gray-200);

}

.modal-body {

  padding: 22px;

  overflow-y: auto;

}

.modal-footer {

  padding: 15px 22px;

  border-top: 1px solid var(--border);

  display: flex;

  justify-content: flex-end;

  gap: 10px;

}


/* =========================================================
   FORMULÁRIO DO MODAL
========================================================= */

.modal-form {

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 15px;

}

.modal-form .full-width {

  grid-column: 1 / -1;

}


/* =========================================================
   TOAST
========================================================= */

.toast {

  position: fixed;

  right: 25px;

  bottom: 25px;

  min-width: 250px;

  max-width: 400px;

  background: var(--dark);

  color: var(--white);

  padding: 13px 17px;

  border-radius: 9px;

  box-shadow: var(--shadow-lg);

  transform: translateY(120px);

  opacity: 0;

  pointer-events: none;

  transition: 0.3s;

  z-index: 10000;

  font-size: 13px;

}

.toast.show {

  transform: translateY(0);

  opacity: 1;

}


/* =========================================================
   ESTADOS
========================================================= */

.empty-state {

  text-align: center;

  padding: 40px 20px;

  color: var(--gray-400);

  font-size: 13px;

}

.error-state {

  text-align: center;

  padding: 30px;

  color: var(--danger);

  font-size: 13px;

}


/* =========================================================
   RESPONSIVIDADE - TABLET
========================================================= */

@media (max-width: 1200px) {

  .dashboard-cards {

    grid-template-columns:
      repeat(3, minmax(0, 1fr));

  }

  .report-grid {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

  }

}


/* =========================================================
   RESPONSIVIDADE - TABLET PEQUENO
========================================================= */

@media (max-width: 900px) {

  :root {

    --sidebar-width: 230px;

  }

  .dashboard-cards {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

  }

  .dashboard-grid {

    grid-template-columns: 1fr;

  }

}


/* =========================================================
   RESPONSIVIDADE - CELULAR
========================================================= */

@media (max-width: 700px) {

  .sidebar {

    transform: translateX(-100%);

  }

  .sidebar.open {

    transform: translateX(0);

    box-shadow: var(--shadow-lg);

  }

  .main-content {

    margin-left: 0;

    width: 100%;

  }

  .menu-toggle {

    display: block;

  }

  .topbar {

    padding: 0 15px;

  }

  .topbar-right {

    display: none;

  }

  .page {

    padding: 20px 15px;

  }

  .page-header {

    align-items: flex-start;

    flex-direction: column;

  }

  .dashboard-cards {

    grid-template-columns: 1fr;

  }

  .report-grid {

    grid-template-columns: 1fr;

  }

  .modal-form {

    grid-template-columns: 1fr;

  }

  .modal-form .full-width {

    grid-column: auto;

  }

  .login-container {

    padding: 28px 22px;

  }

}


/* =========================================================
   CELULAR PEQUENO
========================================================= */

@media (max-width: 420px) {

  .page-header h2 {

    font-size: 20px;

  }

  .stat-card {

    padding: 15px;

  }

  .stat-card strong {

    font-size: 20px;

  }

  .modal-overlay {

    padding: 10px;

  }

  .modal {

    max-height: 95vh;

  }

}


/* =========================================================
   IMPRESSÃO
========================================================= */

@media print {

  .sidebar,
  .topbar,
  .btn,
  .menu-toggle {

    display: none !important;

  }

  .main-content {

    margin: 0;

    width: 100%;

  }

  .page {

    display: block !important;

    padding: 0;

  }

  .content-card,
  .dashboard-panel,
  .stat-card {

    box-shadow: none;

    border: 1px solid #ddd;

  }

}

</style>
